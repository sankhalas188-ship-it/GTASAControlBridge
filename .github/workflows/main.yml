
name: Build GTA SA Control Bridge APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o GTASAControlBridge-mobile-build.zip -d source

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p source/GTASAControlBridge assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTASAControlBridge-debug-apk
          path: source/GTASAControlBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
